{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Login</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<label>Username</label>

<input type="text"
class="form-control mb-3"
name="username"
required>

<label>Password</label>

<input type="password"
class="form-control mb-3"
name="password"
required>

<button class="btn btn-success w-100">
Login
</button>

</form>

<hr>

<p class="text-center">
Don't have an account?
<a href="{% url 'register' %}">
Register
</a>
</p>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
