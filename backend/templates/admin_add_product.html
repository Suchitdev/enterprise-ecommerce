{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Admin - Add Product</h2>
            <p class="text-muted mb-0">
                Add a new product to Enterprise Store.
            </p>
        </div>

        <a href="{% url 'admin_products' %}" class="btn btn-secondary">
            ← Back to Products
        </a>

    </div>


    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">
                Product Information
            </h5>

        </div>


        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <div class="row">

                    <!-- Product Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Product Name
                        </label>

                        <input type="text" name="name" class="form-control" required>

                    </div>


                    <!-- Brand -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Brand
                        </label>

                        <input type="text" name="brand" class="form-control" required>

                    </div>


                    <!-- Category -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select name="category" class="form-select" required>

                            <option value="">
                                Select Category
                            </option>

                            {% for category in categories %}

                            <option value="{{ category.id }}">
                                {{ category.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Price -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Price
                        </label>

                        <input type="number" name="price" class="form-control" step="0.01" min="0" required>

                    </div>


                    <!-- Discount Price -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Discount Price
                        </label>

                        <input type="number" name="discount_price" class="form-control" step="0.01" min="0" required>

                    </div>


                    <!-- Stock -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Stock
                        </label>

                        <input type="number" name="stock" class="form-control" min="0" required>

                    </div>


                    <!-- Description -->

                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description" class="form-control" rows="5" required></textarea>

                    </div>


                    <!-- Availability -->

                    <div class="col-md-12 mb-3">

                        <div class="form-check">

                            <input type="checkbox" name="is_available" class="form-check-input" id="is_available"
                                checked>

                            <label class="form-check-label" for="is_available">
                                Product is available
                            </label>

                        </div>

                    </div>

                </div>


                <hr>


                <div class="d-flex justify-content-end gap-2">

                    <a href="{% url 'admin_products' %}" class="btn btn-secondary">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-success">
                        Add Product
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
