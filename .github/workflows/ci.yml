name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "True"
          POSTGRES_DB: "ci_db"
          POSTGRES_USER: "ci_user"
          POSTGRES_PASSWORD: "ci_password"
          POSTGRES_HOST: "127.0.0.1"
          POSTGRES_PORT: "5432"
        run: |
          python manage.py check

      - name: Build Docker image
        run: |
          docker build -t enterprise-ecommerce:ci .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag enterprise-ecommerce:ci ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-ecommerce:latest
          docker tag enterprise-ecommerce:ci ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-ecommerce:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-ecommerce:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-ecommerce:${{ github.sha }}